
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Continue</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  font-family: Arial, sans-serif;
}

.page {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

.background {
  position: absolute;
  inset: -10px;
  background-image: url("https://i.ibb.co/JjtBRZzm/file-0000000067a481fa823fd723cda16266.png");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  filter: blur(4px);
  transform: scale(1.03);
}

.shade {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.22);
}

.content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

.play-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-width: 190px;
  padding: 19px 30px;
  border-radius: 50px;
  border: 1px solid rgba(255,255,255,0.7);
  background: rgba(0,0,0,0.72);
  color: #fff;
  text-decoration: none;
  font-size: 19px;
  font-weight: bold;
  box-shadow: 0 8px 35px rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: transform .2s;
}

.play-button:active {
  transform: scale(.96);
}

.play-icon {
  width: 0;
  height: 0;
  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
  border-left: 14px solid white;
}

.caption {
  margin-top: 15px;
  color: #fff;
  font-size: 13px;
  text-shadow: 0 2px 6px #000;
}
</style>
</head>

<body>
<div class="page">

  <div class="background"></div>
  <div class="shade"></div>

  <main class="content">
    <a class="play-button"
       href="https://tonicgoverness.com/jdj611b6k?key=b771257f4fb0085c78445fc78a54a093"
       rel="nofollow sponsored noopener">
      <span class="play-icon" aria-hidden="true"></span>
      <span>Continue</span>
    </a>

    <p class="caption">
      Tap to continue
    </p>
  </main>

</div>
</body>
</html>
