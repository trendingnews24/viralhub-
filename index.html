
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Continue</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

.page {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  isolation: isolate;
  background: #000;
}

.background {
  position: absolute;
  inset: -18px;
  z-index: -2;
  background-image: url("https://i.ibb.co/JjtBRZzm/file-0000000067a481fa823fd723cda16266.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: blur(4px);
  transform: scale(1.05);
  animation: slowZoom 18s ease-in-out infinite alternate,
             softBlur 7s ease-in-out infinite alternate;
}

.shade {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: rgba(0,0,0,.24);
}

.content {
  width: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
  text-align: center;
  animation: fadeIn 1.1s ease-out both;
}

.play-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-width: 195px;
  min-height: 62px;
  padding: 18px 30px;
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 60px;
  background: rgba(0,0,0,.76);
  color: #fff;
  text-decoration: none;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .5px;
  box-shadow: 0 0 18px rgba(255,255,255,.12);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  animation: pulseGlow 2.4s ease-in-out infinite;
  transition: transform .2s ease;
}

.play-button:active {
  transform: scale(.95);
  animation: none;
}

.play-icon {
  width: 0;
  height: 0;
  border-top: 9px solid transparent;
  border-bottom: 9px solid transparent;
  border-left: 14px solid #fff;
  filter: drop-shadow(0 0 5px rgba(255,255,255,.55));
}

.caption {
  margin-top: 17px;
  color: rgba(255,255,255,.92);
  font-size: 13px;
  text-shadow: 0 2px 8px #000;
  animation: fadeIn 1.6s ease-out both;
}

@keyframes slowZoom {
  from { transform: scale(1.05); }
  to   { transform: scale(1.16); }
}

@keyframes softBlur {
  from { filter: blur(3px); }
  to   { filter: blur(5px); }
}

@keyframes pulseGlow {
  0%, 100% {
    box-shadow: 0 0 14px rgba(255,255,255,.12);
  }
  50% {
    box-shadow: 0 0 30px rgba(255,255,255,.35);
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .background, .play-button, .content, .caption {
    animation: none;
  }
}
</style>
</head>

<body>
<div class="page">

  <div class="background" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <main class="content">
    <a class="play-button"
       href="https://tonicgoverness.com/jdj611b6k?key=b771257f4fb0085c78445fc78a54a093"
       rel="nofollow sponsored noopener">
      <span class="play-icon" aria-hidden="true"></span>
      <span>Continue</span>
    </a>

    <p class="caption">Tap to continue to the destination</p>
  </main>

</div>
</body>
</html>
