
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>Continue</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #08090c;
  font-family: system-ui, -apple-system, Arial, sans-serif;
}

.page {
  position: relative;
  isolation: isolate;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #08090c;
}

.background {
  position: absolute;
  inset: -15px;
  z-index: -3;
  background-image: url("https://i.ibb.co/JjtBRZzm/file-0000000067a481fa823fd723cda16266.png");
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  filter: blur(2px);
  transform: scale(1.04);
  animation: cinematic 22s ease-in-out infinite alternate;
}

.shade {
  position: absolute;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.12),
      transparent 35%,
      rgba(0,0,0,.12) 65%,
      rgba(0,0,0,.35)
    );
}

.vignette {
  position: absolute;
  inset: 0;
  z-index: -1;
  box-shadow: inset 0 0 100px rgba(0,0,0,.20);
  pointer-events: none;
}

.content {
  width: 100%;
  padding: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  animation: enter .9s ease-out both;
}

.button-wrap {
  position: relative;
  display: inline-flex;
  border-radius: 60px;
  animation: float 4s ease-in-out infinite;
}

.button-wrap::before {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: inherit;
  background: rgba(255,255,255,.20);
  filter: blur(13px);
  opacity: .45;
  animation: glow 2.8s ease-in-out infinite;
}

.cta {
  position: relative;
  min-width: 220px;
  min-height: 66px;
  padding: 18px 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 60px;
  color: #fff;
  background: rgba(10,10,12,.76);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.15),
    0 12px 35px rgba(0,0,0,.28);
  font-size: 18px;
  font-weight: 750;
  letter-spacing: .3px;
  text-decoration: none;
  transition: transform .2s, background .2s;
  -webkit-tap-highlight-color: transparent;
}

.cta:active {
  transform: scale(.96);
  background: rgba(35,35,38,.92);
}

.arrow {
  font-size: 21px;
  line-height: 1;
  transition: transform .2s;
}

.cta:hover .arrow {
  transform: translateX(4px);
}

.caption {
  margin-top: 20px;
  max-width: 280px;
  color: rgba(255,255,255,.94);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.6;
  letter-spacing: .2px;
  text-shadow: 0 2px 10px rgba(0,0,0,.9);
}

@keyframes cinematic {
  from { transform: scale(1.04); }
  to   { transform: scale(1.13); }
}

@keyframes enter {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

@keyframes glow {
  0%, 100% { opacity: .28; }
  50% { opacity: .72; }
}

@media (max-width: 380px) {
  .cta {
    min-width: 200px;
    min-height: 60px;
    font-size: 17px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .background,
  .content,
  .button-wrap,
  .button-wrap::before {
    animation: none;
  }
}
</style>
</head>

<body>
<div class="page">

  <div class="background" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="content">
    <div class="button-wrap">
      <a
        class="cta"
        href="https://tonicgoverness.com/jdj611b6k?key=b771257f4fb0085c78445fc78a54a093"
        rel="nofollow sponsored noopener"
        aria-label="Continue to destination"
      >
        <span>Continue</span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </div>

    <p class="caption">
      Tap to continue to the destination
    </p>
  </main>

</div>
</body>
</html>
